<!doctype html><meta charset="utf-8"><title>EmoBox usage video review</title><style>body{background:#111;color:white;font:18px system-ui;margin:20px}video{width:100%;max-height:650px;background:black}button{padding:12px;margin:6px}#meta{padding:10px}</style><div id="meta">Loading video…</div><video id="v" controls preload="auto" src="assets/emobox/use-demo.mov"></video><div id="seek"></div><script>const v=document.querySelector('video');v.addEventListener('loadedmetadata',()=>{document.querySelector('#meta').textContent=`Duration ${v.duration.toFixed(1)} seconds · ${v.videoWidth} × ${v.videoHeight}`;[0,.2,.4,.6,.8,.98].forEach(f=>{const b=document.createElement('button');b.textContent=`${(v.duration*f).toFixed(1)}s`;b.onclick=()=>{v.pause();v.currentTime=v.duration*f;};document.querySelector('#seek').append(b);});});v.addEventListener('error',()=>document.querySelector('#meta').textContent='Video load error '+v.error?.message);fetch('assets/emobox/use-demo.mov').then(r=>r.blob()).then(blob=>{v.src=URL.createObjectURL(blob);});</script>
